services:
  painel:
    build: .
    env_file: .env
    environment: [FIN_DATA_DIR=/data]
    volumes: [./data:/data, ./rules.yaml:/app/rules.yaml:ro]
    ports: ["8501:8501"]
    restart: unless-stopped
  sync:   # coleta a cada 6 h
    build: .
    env_file: .env
    environment: [FIN_DATA_DIR=/data]
    volumes: [./data:/data, ./rules.yaml:/app/rules.yaml:ro]
    entrypoint: ["/bin/sh", "-c", "while true; do python -m financas.cli sync; sleep 21600; done"]
    restart: unless-stopped
