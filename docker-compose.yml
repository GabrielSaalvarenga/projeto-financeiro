# Dois ambientes, como no ServiceNow:
#   prod  (porta 8501) — código aprovado (imagem montada de uma TAG do git em .prod-src/), dados reais em ./data
#   dev   (porta 8502) — código da pasta de trabalho, dados = CLONE de prod em ./data-dev (pode sujar à vontade)
# Operação: ./ambientes status | clonar | promover   (ver README)
name: financas

services:
  prod:
    build: ./.prod-src
    container_name: financas-prod
    environment: [FIN_DATA_DIR=/data, FIN_ENV_FILE=/data/.env, FIN_ENV_NAME=prod]
    volumes: ["./data:/data"]
    ports: ["8501:8501"]
    restart: unless-stopped

  sync-prod:   # coleta a cada 6 h em prod — só sobe com: docker compose --profile sync up -d sync-prod
    profiles: [sync]
    build: ./.prod-src
    container_name: financas-sync-prod
    environment: [FIN_DATA_DIR=/data, FIN_ENV_FILE=/data/.env, FIN_ENV_NAME=prod]
    volumes: ["./data:/data"]
    entrypoint: ["/bin/sh", "-c", "while true; do python -m financas.cli sync; sleep 21600; done"]
    restart: unless-stopped

  dev:
    build: .
    container_name: financas-dev
    environment: [FIN_DATA_DIR=/data, FIN_ENV_FILE=/data/.env, FIN_ENV_NAME=dev]
    volumes:
      - ./data-dev:/data
      - ./financas:/app/financas      # código ao vivo: editou, o Streamlit recarrega
      - ./rules.yaml:/app/rules.yaml:ro
    ports: ["8502:8501"]
    restart: unless-stopped

  demo:   # vitrine: TUDO fictício (gerado por `cli demo`), sem chaves — seguro para mostrar a outras pessoas
          # sobe com: docker compose --profile demo up -d demo · mesma porta do "novo" (8503): rode um de cada vez
          # regerar os dados: docker compose --profile demo run --rm demo python -m financas.cli demo
    profiles: [demo]
    build: .
    container_name: financas-demo
    environment: [FIN_DATA_DIR=/data, FIN_ENV_FILE=/data/.env, FIN_ENV_NAME=demo]
    volumes:
      - ./data-demo:/data
      - ./financas:/app/financas
      - ./rules.yaml:/app/rules.yaml:ro
    ports: ["8503:8501"]

  novo:   # "primeiro uso": pasta de dados vazia, sem chaves — para ver o painel como uma pessoa nova vê
          # sobe com: docker compose --profile novo up -d novo · zerar: parar, apagar ./data-novo e subir de novo
    profiles: [novo]
    build: .
    container_name: financas-novo
    environment: [FIN_DATA_DIR=/data, FIN_ENV_FILE=/data/.env]
    volumes:
      - ./data-novo:/data
      - ./financas:/app/financas
      - ./rules.yaml:/app/rules.yaml:ro
    ports: ["8503:8501"]
