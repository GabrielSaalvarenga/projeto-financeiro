# Teste: usa uma CÓPIA dos dados (data-teste/), nunca a pasta data/ real.
# Para produção (ex.: ZimaOS), troque ./data-teste por ./data.
services:
  painel:
    build: .
    environment: [FIN_DATA_DIR=/data, FIN_ENV_FILE=/data/.env]
    volumes: [./data-teste:/data, ./rules.yaml:/app/rules.yaml:ro]
    ports: ["8502:8501"]
    restart: unless-stopped
  sync:   # coleta a cada 6 h — só sobe com: docker compose --profile sync up
    profiles: [sync]
    build: .
    environment: [FIN_DATA_DIR=/data, FIN_ENV_FILE=/data/.env]
    volumes: [./data-teste:/data, ./rules.yaml:/app/rules.yaml:ro]
    entrypoint: ["/bin/sh", "-c", "while true; do python -m financas.cli sync; sleep 21600; done"]
    restart: unless-stopped
