# Gera o app do Mac (.dmg) e o instalador do Windows (.exe).
# - Ao publicar uma tag de versão (git tag v0.9.0 && git push origin v0.9.0): os arquivos vão para a Release da tag.
# - Num Pull Request que mexa no app, ou pela aba Actions → "App para Mac e Windows" → Run workflow:
#   os arquivos ficam em "Artifacts" da execução (para testar antes de lançar).
name: App para Mac e Windows

on:
  push:
    tags: ["v*.*.*"]
  pull_request:   # testar o app antes de lançar: os arquivos ficam em "Artifacts" da execução do PR
    paths: ["painel_desktop.py", "empacotar/**", ".github/workflows/app-desktop.yml", "requirements.txt"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest      # Apple Silicon (M1/M2/M3…)
          - os: windows-latest
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            empacotar/requisitos-build.txt

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r empacotar/requisitos-build.txt

      - name: Testes
        run: python -m pytest -q

      - name: Versão
        id: v
        run: echo "versao=$(python -c 'import financas; print(financas.__version__)')" >> "$GITHUB_OUTPUT"

      - name: Conferir tag x versão
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          [ "${GITHUB_REF_NAME#v}" = "${{ steps.v.outputs.versao }}" ] || {
            echo "A tag $GITHUB_REF_NAME não bate com financas/__init__.py (${{ steps.v.outputs.versao }})"; exit 1; }

      - name: Empacotar (PyInstaller)
        run: pyinstaller --noconfirm empacotar/painel.spec

      - name: Teste rápido do app empacotado (o painel responde?)
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then
            BIN="dist/Painel Financeiro.app/Contents/MacOS/Painel Financeiro"
          else
            BIN="dist/Painel Financeiro/Painel Financeiro.exe"
          fi
          export FIN_DATA_DIR="$RUNNER_TEMP/dados-teste"
          # o stdin fica aberto (sleep) para o servidor não achar que a janela fechou
          (sleep 120 | "$BIN" --servidor 8799 > "$RUNNER_TEMP/servidor.log" 2>&1 &)
          for i in $(seq 1 60); do
            if curl -fs http://127.0.0.1:8799/_stcore/health > /dev/null; then
              echo "OK: painel respondeu em ~${i}s"
              curl -fs http://127.0.0.1:8799/ | grep -q "<title>" && exit 0
            fi
            sleep 2
          done
          echo "O painel empacotado não respondeu"; cat "$RUNNER_TEMP/servidor.log"; exit 1

      - name: Criar .dmg (Mac)
        if: runner.os == 'macOS'
        run: sh empacotar/criar_dmg.sh "${{ steps.v.outputs.versao }}"

      - name: Criar instalador (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress }
          & $iscc "/DVersao=${{ steps.v.outputs.versao }}" empacotar\instalador.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Guardar arquivos da execução
        uses: actions/upload-artifact@v4
        with:
          name: painel-${{ runner.os }}
          path: |
            dist/*.dmg
            dist/*-Instalador.exe
          if-no-files-found: error

      - name: Anexar à Release da tag
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shopt -s nullglob
          files=(dist/*.dmg dist/*-Instalador.exe)
          # os dois sistemas rodam juntos: quem chegar primeiro cria a Release, o outro só anexa
          gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1 || \
            gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes "Novidades: veja o CHANGELOG.md" || true
          gh release upload "$GITHUB_REF_NAME" "${files[@]}" --clobber
